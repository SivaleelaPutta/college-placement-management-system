
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CPMS - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background: #f4f7fb;

            font-family: Arial, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 430px;

            max-width: 100%;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;

            color: #123f73;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: 600;

            color: #374151;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;

            border-color: #164b87;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            background: #164b87;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #103961;
        }

        .message {
            padding: 10px;

            margin-bottom: 15px;

            border-radius: 6px;

            background: #fff3cd;

            color: #664d03;

            font-size: 14px;
        }

        .bottom {
            text-align: center;

            margin-top: 20px;

            color: #6b7280;

            font-size: 14px;
        }

        .bottom a {
            color: #164b87;

            text-decoration: none;

            font-weight: bold;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #6b7280;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>
        Welcome Back
    </h1>

    <p class="subtitle">
        College Placement Management System
    </p>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form action="{{ url_for('login') }}"
          method="POST">


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <label>
            Account Type
        </label>

        <select name="role" required>

            <option value="">
                Select Account Type
            </option>

            <option value="student">
                Student
            </option>

            <option value="admin">
                Admin
            </option>

            <option value="cdpc">
                CDPC
            </option>

            <option value="company">
                Company
            </option>

        </select>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="bottom">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </div>


    <a class="back"
       href="{{ url_for('landing') }}">

        ← Back to Home

    </a>

</div>

</body>

</html>
