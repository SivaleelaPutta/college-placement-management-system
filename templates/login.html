<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RGUKT Placement Management System</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:#eef3fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;

}

.container{
width:1200px;
max-width:100%;
background:white;
display:flex;
border-radius:24px;
overflow:hidden;
box-shadow:
0 25px 60px rgba(0,0,0,.18);
animation:fadeUp .7s ease;
}

.left{
    flex:1;
    padding:60px;
    background:
        linear-gradient(rgba(5,45,115,.72), rgba(5,45,115,.72)),
        url("{{ url_for('static', filename='images/rgukt-campus.jpg') }}");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
width:160px;
height:160px;
background:white;
padding:1px;
border-radius:50%;
box-shadow:0 10px 30px rgba(0,0,0,.35);
margin-bottom:30px;
}

.left h1{
font-size:60px;
font-weight:700;
letter-spacing:2px;
margin-bottom:10px;
}

.left h2{
font-size:30px;
font-weight:500;
margin-bottom:22px;
opacity:.95;
}

.left hr{

width:70%;
margin-bottom:25px;

}

.left p{

font-size:20px;
line-height:1.8;

}

.right{

flex:1;
padding:60px;

}

.right h1{

text-align:center;
color:#0d2c7c;
font-size:42px;
margin-bottom:10px;

}

.subtitle{

text-align:center;
color:#666;
margin-bottom:35px;

}

label{
font-weight:600;
display:block;
margin-bottom:8px;
margin-top:20px;
}

.input-box{
    display:flex;
    align-items:center;
    border:2px solid #d8dce5;
    border-radius:14px;
    padding:15px;
    transition:.3s;
    background:white;
}

.input-box:focus-within{
    border-color:#1565ff;
    box-shadow:0 0 18px rgba(21,101,255,.18);
}

.input-box i{
    color:#666;
}

.input-box input{
    width:100%;
    border:none;
    outline:none;
    padding-left:12px;
    font-size:16px;
    background:transparent;
}

.eye{

cursor:pointer;

}

.options{

display:flex;
justify-content:space-between;
margin:20px 0;

}

.options a{

text-decoration:none;
color:#1565ff;
font-weight:bold;

}

.login{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;

    background:linear-gradient(90deg,#1565ff,#0d6efd);

    color:white;
    font-size:18px;
    font-weight:600;

    cursor:pointer;

    transition:.35s;
}

.login:hover{

    transform:translateY(-3px);

    box-shadow:0 12px 30px rgba(21,101,255,.35);

    background:linear-gradient(90deg,#004fd1,#1565ff);

}

.or{

text-align:center;
margin:25px 0;
font-weight:bold;
color:#888;

}

.google{

width:100%;
padding:15px;
border:2px solid #1565ff;
border-radius:12px;
background:white;
cursor:pointer;
font-size:18px;
display:flex;
justify-content:center;
align-items:center;
gap:12px;

}

.google img{

width:25px;

}

.bottom{

text-align:center;
margin-top:30px;

}

.bottom a{

color:#1565ff;
text-decoration:none;
font-weight:bold;

}

footer{

margin-top:20px;
text-align:center;
color:#666;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.left{

text-align:center;

}

.logo{

margin:auto auto 25px;

}

.left hr{

margin:auto;
margin-top:20px;
margin-bottom:20px;

}

}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.selected-role {
    width: fit-content;
    margin: 0 auto 18px;
    padding: 8px 14px;

    background: #edf4ff;
    color: #0d6efd;

    border-radius: 20px;

    font-size: 13px;
    font-weight: 600;

    display : flex;
    align-items: center;
    gap: 8px;
}


</style>

</head>

<body>



<div class="container">

<div class="left">

<img src="{{ url_for('static', filename='images/new-logo.png') }}" class="logo">

<h1>RGUKT</h1>

<h2>Placement Management System</h2>

<hr>

<p>

Empowering students through innovation,
opportunities, and career excellence.
Access your placement portal securely.

</p>

</div>

<div class="right">

<div class="selected-role" id="selectedRole">
    <i class="fas fa-user-graduate"></i>
    <span>Student Login</span>
</div>

<h1>Welcome Back!</h1>

<p class="subtitle">

Login to continue to your dashboard

</p>

<form action="{{ url_for('home') }}" method="GET">

<label>Email / Roll Number</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
placeholder="Enter Email or Roll Number" required
oninvalid="this.setCustomValidity('Please enter your Email.')"
oninput="this.setCustomValidity('')">

</div>

<label>Password</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter Password" required
oninvalid="this.setCustomValidity('Please enter your Password.')"
oninput="this.setCustomValidity('')">

<i
class="fa-solid fa-eye eye"
id="toggle"></i>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember me

</label>

<a href="#">Forgot Password?</a>

</div>



<button type="submit" class= "login">
    Login
</button>


<div class="or">

OR

</div>

<button
type="button"
class="google">

<img src="{{ url_for('static', filename='images/google.png') }}">

Continue with Google

</button>

<p class="bottom">

New User?

<a href="{{ url_for('register') }}">Create an Account</a>

</p>

</form>

</div>

</div>

<script>
    const selectedRole = "{{ selected_role|default('student') }}";

    const roleDetails = {
        student: {
            icon: "fa-user-graduate",
            text: "Student Login"
        },

        cdpc: {
            icon: "fa-building-columns",
            text: "CDPC Login"
        },

        admin: {
            icon: "fa-user-shield",
            text: "Administrator Login"
        },

        company: {
            icon: "fa-industry",
            text: "Company Login"
        }
    };

    const role = roleDetails[selectedRole] || roleDetails.student;

    const roleContainer = document.getElementById("selectedRole");

    roleContainer.innerHTML = `
        <i class="fas ${role.icon}"></i>
        <span>${role.text}</span>
    `;
</script>


</body>
</html>
