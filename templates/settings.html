<div class="dashboard-content">

    <div style="
        background:white;
        padding:30px;
        border-radius:12px;
        box-shadow:0 4px 15px rgba(0,0,0,0.08);
    ">

        <h2 style="margin-bottom:10px;">
            <i class="fas fa-gear"></i>
            Settings
        </h2>

        <p style="color:#718096; margin-bottom:25px;">
            Manage your account settings.
        </p>

        <div style="
            background:#f7fafc;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        ">

            <h3 style="margin-bottom:15px;">
                Account Information
            </h3>

            <p>
                <strong>Name:</strong>
                {{ user.full_name }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ user.email }}
            </p>

            <p>
                <strong>Role:</strong>
                {{ user.role|capitalize }}
            </p>

        </div>

        <div style="
            background:#f7fafc;
            padding:20px;
            border-radius:10px;
        ">

            <h3 style="margin-bottom:15px;">
                Security
            </h3>

            <a
                href="{{ url_for('profile') }}"
                style="
                    display:inline-block;
                    background:#1673f9;
                    color:white;
                    padding:10px 18px;
                    border-radius:7px;
                    text-decoration:none;
                "
            >
                <i class="fas fa-user"></i>
                Manage Profile
            </a>

        </div>

    </div>

</div>
