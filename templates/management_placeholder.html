<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ title }} - RGUKT Placement Portal</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins','Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:#f4f7fc;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.placeholder-card{
    width:600px;
    max-width:100%;
    background:white;
    border-radius:18px;
    padding:50px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon{
    width:75px;
    height:75px;
    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:#eaf3ff;
    color:#0d6efd;

    font-size:30px;
}

h1{
    color:#1f2937;
    margin-bottom:12px;
}

p{
    color:#6b7280;
    line-height:1.7;
    margin-bottom:30px;
}

.back-btn{
    display:inline-block;
    padding:12px 22px;
    border-radius:10px;

    background:#0d6efd;
    color:white;

    text-decoration:none;
    font-weight:600;

    transition:.3s;
}

.back-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(13,110,253,.25);
}

</style>

</head>

<body>

<div class="placeholder-card">

    <div class="icon">
        <i class="fas fa-tools"></i>
    </div>

    <h1>{{ title }}</h1>

    <p>
        {{ description }}
        <br>
        This module will be developed in the upcoming project phase.
    </p>

    <a href="{{ url_for('cdpc_dashboard') }}" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
    </a>

</div>

</body>
</html>
