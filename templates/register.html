<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGUKT Placement Portal - Registration</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Expanded container dimensions */
        .auth-container {
            display: flex;
            width: 1200px;
            max-width: 95%;
            min-height: 620px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Left Side Panel */
        .brand-section {
            width: 40%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .brand-top {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: white;
            padding: 6px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(13, 110, 253, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Larger emblem inside fixed ring */
        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.3);
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            font-size: 15px;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        /* Feature Badges */
        .feature-pills {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13.5px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #e2e8f0;
        }

        .pill i {
            color: #38bdf8;
            font-size: 16px;
        }

        /* Right Side: Form Panel */
        .form-section {
            width: 60%;
            padding: 50px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 28px;
            color: #0f172a;
            font-weight: 700;
        }

        .form-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }

        /* 2-Column Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 4px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 16px;
            color: #0d6efd;
            font-size: 15px;
        }

        .input-box input, .input-box select {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
            background: #fff;
        }

        .input-box input:focus, .input-box select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-submit {
            grid-column: span 2;
            width: 100%;
            height: 48px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #0284c7;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }

        .auth-footer a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 850px) {
            .auth-container {
                flex-direction: column;
            }
            .brand-section, .form-section {
                width: 100%;
                padding: 35px 25px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .btn-submit {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- Left Section -->
        <div class="brand-section">
            <div class="brand-top">
                <div class="brand-logo">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="RGUKT Logo">
                </div>
                <h1 class="brand-title">RGUKT</h1>
                <p class="brand-subtitle">Placement Portal</p>
            </div>

            <div class="feature-pills">
                <div class="pill">
                    <i class="fas fa-id-badge"></i>
                    <span>Student Profile Setup</span>
                </div>
                <div class="pill">
                    <i class="fas fa-briefcase"></i>
                    <span>Apply for Drive Notifications</span>
                </div>
                <div class="pill">
                    <i class="fas fa-chart-line"></i>
                    <span>Track Real-time Application Status</span>
                </div>
            </div>

            <p style="font-size: 12px; opacity: 0.6; margin-top: 20px;">
                Placement Cell © RGUKT
            </p>
        </div>

        <!-- Right Section -->
        <div class="form-section">
            <div class="form-header">
                <h2>New Student Registration</h2>
                <p>Fill in your details to create your placement account</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-grid">
                    
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <div class="input-box">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullName" name="name" placeholder="Full name" required>
                        </div>
                    </div>

                    <!-- Roll Number -->
                    <div class="form-group">
                        <label for="roll">Roll Number</label>
                        <div class="input-box">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="roll" name="roll" placeholder="e.g. O200001" required>
                        </div>
                    </div>

                    <!-- Department -->
                    <div class="form-group">
                        <label for="dept">Department</label>
                        <div class="input-box">
                            <i class="fas fa-graduation-cap"></i>
                            <select id="dept" name="department" required>
                                <option value="" disabled selected>Select Branch</option>
                                <option value="CSE">CSE</option>
                                <option value="ECE">ECE</option>
                                <option value="EEE">EEE</option>
                                <option value="MECH">MECH</option>
                                <option value="CIVIL">CIVIL</option>
                            </select>
                        </div>
                    </div>

                    <!-- Campus Email -->
                    <div class="form-group">
                        <label for="email">Campus Email</label>
                        <div class="input-box">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="student@rgukto.ac.in" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group full-width">
                        <label for="password">Create Password</label>
                        <div class="input-box">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit">Register Account</button>
                </div>
            </form>

            <div class="auth-footer">
                Already registered? <a href="{{ url_for('login') }}">Login here</a>
            </div>
        </div>

    </div>

</body>
</html>
